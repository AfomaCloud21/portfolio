baseURL: "https://afomacloud21.github.io/portfolio/"
languageCode: "en-us"
title: "Afoma Egbuonu | DevOps Engineer"
theme: hugo-profile

# Multilingual configuration
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

languages:
  en:
    languageName: "English"
    weight: 1
    contentDir: "content"
    menu:
      main:
        - identifier: projects
          name: Projects
          title: Case studies
          url: /projects
          weight: 1
        - identifier: blog
          name: Blog
          title: Blog posts
          url: /blogs
          weight: 2
        - identifier: gallery
          name: Gallery
          title: Image gallery
          url: /gallery
          weight: 3
outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

#services:
  #googleAnalytics:
    #id: G-MEASUREMENT_ID
  #disqus:
